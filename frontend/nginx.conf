server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea archivo real cae a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvía tal cual al backend principal (ya expone sus rutas bajo /api)
    location /api/ {
        proxy_pass http://backend_principal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
